[workspace]
resolver = "2"
members = ["crates/svc-core", "crates/svc", "crates/svc-repo", "crates/svc-agent", "crates/svc-tui", "crates/svc-forge"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.1", features = ["v7", "serde"] }
blake3 = "1.8.7"
postcard = { version = "1.1.3", features = ["use-std"] }
thiserror = "2"
tree-sitter = "0.27.0"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
similar = "3.2.0"
redb = { version = "4.3.0", features = ["uuid", "experimental-multiprocess"] }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "=0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-input = "0.15.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
agent-client-protocol = "2.1.0"
svc-core = { path = "crates/svc-core" }
svc-repo = { path = "crates/svc-repo" }

# The dev build is what every gate and demo runs. Our own crates stay unoptimised and
# checked; the libraries doing the byte work do not: redb's debug build walks every
# allocated page on open, and parsing, hashing and decoding dominate a verb's time.
[profile.dev.package.redb]
opt-level = 3
debug-assertions = false
[profile.dev.package.postcard]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-rust]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
