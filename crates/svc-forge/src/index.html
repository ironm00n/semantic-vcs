<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>svc forge</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131a2d;--ink:#edf2ff;--muted:#98a4bf;--line:#28334f;--accent:#70e1b2;--warn:#ffbd69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:22px 28px;border-bottom:1px solid var(--line);display:flex;gap:20px;align-items:baseline}h1{font-size:20px;margin:0;color:var(--accent)}main{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 68px)}nav{border-right:1px solid var(--line);padding:18px}button{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:11px;margin:0 0 8px;background:var(--panel);color:var(--ink);cursor:pointer}button:hover{border-color:var(--accent)}section{padding:24px;overflow:auto}.muted{color:var(--muted)}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:5px 8px;background:var(--panel);border-radius:20px;border:1px solid var(--line)}article{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}details{margin-top:10px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8d2eb}.conflict{border-left:3px solid var(--warn)}@media(max-width:700px){main{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body><header><h1>svc forge</h1><span class="muted">compiler-grade history, locally</span></header><main><nav id="repos">Loading repositories…</nav><section id="view"><p class="muted">Choose a repository.</p></section></main><script>
const repos=document.querySelector('#repos'),view=document.querySelector('#view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=x=>esc(JSON.stringify(x,null,2));
async function load(){const rs=await fetch('/api/repositories').then(r=>r.json());repos.innerHTML=rs.map(r=>`<button data-slug="${esc(r.slug)}"><b>${esc(r.name)}</b><br><small class="muted">${r.snapshots} snapshots · ${r.operations} ops</small></button>`).join('')||'<span class="muted">No repositories in catalog.</span>';repos.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.slug));if(rs[0])show(rs[0].slug)}
async function show(slug){const r=await fetch('/api/repositories/'+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw Error(r.statusText);return r.json()});view.innerHTML=`<h2>${esc(r.name)}</h2><p class="muted">${esc(r.path)} · head ${esc(r.head)}</p><p>${esc(r.description)}</p><div class="stats"><span class="pill">${r.snapshots.length} snapshots</span><span class="pill">${r.operations.length} typed ops</span><span class="pill">${r.review_queue.length} reviews</span></div><h3>Snapshots & entities</h3>${r.snapshots.map(s=>`<article class="${s.conflicts.length?'conflict':''}"><b>${esc(s.message||'(undescribed)')}</b> <span class="muted">${esc(s.id)}</span><p>${s.entities.length} entities · ${s.conflicts.length} conflicts · parents ${esc(s.parents.join(', ')||'none')}</p><details><summary>Browse entities</summary>${s.entities.map(e=>`<pre>${esc(e.record?.kind||e.kind)} ${esc(e.record?.name||e.name)}  ${esc(e.record?.file||e.file)}\n${esc(e.id)}</pre>`).join('')||'<p class="muted">No entities.</p>'}</details>${s.conflicts.length?`<details><summary>Conflicts</summary><pre>${json(s.conflicts)}</pre></details>`:''}</article>`).join('')}<h3>Typed operation history</h3>${r.operations.map((o,i)=>`<article><b>#${i+1} ${esc(Object.keys(o.op)[0]||o.op)}</b><pre>${json(o)}</pre></article>`).join('')||'<p class="muted">No operations.</p>'}<h3>Review queue</h3>${r.review_queue.map(q=>`<article><pre>${json(q)}</pre></article>`).join('')||'<p class="muted">Queue clear.</p>'}`}
load().catch(e=>view.innerHTML='<p class="conflict">'+esc(e)+'</p>');
</script></body></html>
