<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#121827;--panel2:#0d1321;--ink:#edf2ff;--muted:#94a0b8;--line:#27324a;--accent:#72e0b4;--blue:#7cb7ff;--warn:#ffbd69;--bad:#ff7b88;--good:#79d991}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px ui-monospace,SFMono-Regular,Menlo,monospace}button,input,select{font:inherit;color:inherit}header{height:60px;padding:0 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;background:rgba(9,13,24,.95);position:sticky;top:0;z-index:10}h1{font-size:19px;margin:0;color:var(--accent)}h2{font:600 25px system-ui,sans-serif;letter-spacing:-.5px;margin:0 0 5px}h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:25px 0 10px}main{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 60px)}nav{padding:15px;border-right:1px solid var(--line);background:var(--panel2)}nav>p{padding:5px}.repo-button,.change-button,.tab,button{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;cursor:pointer}.repo-button{display:block;width:100%;text-align:left;margin-bottom:8px}.repo-button.active,.repo-button:hover,.change-button.active,.change-button:hover{border-color:var(--accent)}section{padding:24px;min-width:0;overflow:auto}.repo-header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.repo-header p{margin:3px 0}.stats,.tabs,.row,.badges,.op-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.stats{margin-top:14px}.pill{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--muted)}.pill.head{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.tabs{border-bottom:1px solid var(--line);margin:20px 0}.tab{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted)}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-panel{display:none}.tab-panel.active{display:block}.history-layout{display:grid;grid-template-columns:minmax(260px,32%) minmax(0,1fr);gap:18px}.change-list{border-right:1px solid var(--line);padding-right:18px}.change-button{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;text-align:left;margin-bottom:9px;padding:12px}.graph-dot{width:11px;height:11px;border:2px solid var(--blue);border-radius:50%;margin-top:4px;position:relative}.graph-dot:after{content:"";position:absolute;width:1px;height:48px;background:var(--line);left:3px;top:11px}.change-button:last-child .graph-dot:after{display:none}.change-title{font:600 15px system-ui,sans-serif;margin-bottom:5px}.muted{color:var(--muted)}.small{font-size:12px}.change-detail{min-width:0}.change-hero{padding:3px 2px 15px;border-bottom:1px solid var(--line)}article{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.operation{position:relative;padding-left:18px}.operation:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue);border-radius:3px 0 0 3px}.operation.flagged:before,.conflict:before{background:var(--bad)}.operation-title{font:600 16px system-ui,sans-serif}.operation-summary{font:500 15px system-ui,sans-serif;margin:8px 0 4px}.source-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.source-pane{min-width:0}.source-label{color:var(--muted);font-size:12px;margin-bottom:4px}.source{margin:0;background:#070b13;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:360px;overflow:auto;white-space:pre;tab-size:4;color:#d8e3f8}.source.empty{color:var(--muted);white-space:normal}.syntax-keyword{color:#d69cff;font-weight:600}.syntax-function,.syntax-tag{color:#7cb7ff}.syntax-type,.syntax-constructor{color:#74d9e7}.syntax-string,.syntax-string-regexp,.syntax-string-special{color:#82d99c}.syntax-comment,.syntax-comment-documentation{color:#75819a;font-style:italic}.syntax-number,.syntax-constant,.syntax-constant-builtin,.syntax-boolean{color:#f2cf75}.syntax-property,.syntax-variable-member,.syntax-module{color:#6ed5d0}.syntax-variable-parameter{color:#9edbe4;font-style:italic}.syntax-operator,.syntax-escape,.syntax-string-escape{color:#e6a1d2}.syntax-attribute{color:#e4c46b}.syntax-punctuation,.syntax-punctuation-bracket,.syntax-punctuation-delimiter{color:#9aa6bc}.syntax-error{color:var(--bad);text-decoration:underline}.added{color:var(--good)}.removed{color:var(--bad)}.entity-layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(330px,42%);gap:16px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters input{min-width:220px;flex:1}.filters input,.filters select{border:1px solid var(--line);border-radius:8px;padding:9px;background:var(--panel)}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:8px}.entity{margin:0;cursor:pointer}.entity:hover,.entity.selected{border-color:var(--accent)}.entity.synthetic{opacity:.65}.entity-detail{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px;position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto}.entity-detail dt{color:var(--muted);margin-top:9px}.entity-detail dd{margin:2px 0}.review-clear{padding:24px;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}details{margin-top:10px;color:var(--muted)}summary{cursor:pointer}pre{overflow:auto}code,.mono{color:var(--blue)}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{color:var(--muted);padding:16px;border:1px dashed var(--line);border-radius:8px}.conflict{position:relative}.conflict:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}.error{color:var(--bad)}article,p,code,.entity-detail dd{min-width:0;overflow-wrap:anywhere;word-break:break-word}@media(max-width:900px){main{grid-template-columns:1fr}nav{border-right:0;border-bottom:1px solid var(--line)}.history-layout,.entity-layout{grid-template-columns:1fr}.change-list{border-right:0;padding-right:0}.entity-detail{position:static;max-height:none}}@media(max-width:620px){section{padding:15px}.source-grid{grid-template-columns:1fr}.repo-header{display:block}}
.entity-change{margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--panel2);padding:10px 12px}
.entity-change .entity-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;cursor:pointer}
.entity-change .entity-head b{color:var(--ink)}
.diff{margin-top:10px;max-height:480px}
.diff .dl{display:block;padding:0 6px;margin:0 -6px}
.diff .dl.add{background:rgba(121,217,145,.14)}
.diff .dl.del{background:rgba(255,123,136,.16)}

.diff .dl.ctx::before{content:' '}
</style>
</head>
<body>
<header><h1>svc forge</h1><span class="muted">semantic development history</span></header>
<main><nav id="repos"><p class="muted">Loading repositories…</p></nav><section id="view"><p class="muted">Choose a repository.</p></section></main>
<script>
const repos=document.querySelector('#repos'),view=document.querySelector('#view');
const PAGE_SIZE=100;
let currentRepo=null,currentChange=null,currentEntity=null,entityLimit=PAGE_SIZE,activeTab='history';
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const json=value=>esc(JSON.stringify(value,null,2));
const short=value=>String(value??'').slice(0,8);
const opVariant=op=>typeof op==='string'?op:(Object.keys(op||{})[0]||'Unknown');
const opPayload=entry=>typeof entry.op==='string'?{}:(entry.op?.[opVariant(entry.op)]||{});
const operationIx=(entry,index)=>entry.ix??index;
const snapshotById=(repo,id)=>repo.snapshots.find(snapshot=>snapshot.id===id);
const snapshotForEntry=(repo,entry)=>snapshotById(repo,entry.after?.root);
const entityIdForEntry=entry=>entry.subject?.id||opPayload(entry).id||null;
const entityIn=(snapshot,id)=>snapshot?.entities?.find(entity=>entity.id===id)||null;
const currentEntityById=(repo,id)=>repo.snapshots.flatMap(snapshot=>snapshot.entities||[]).find(entity=>entity.id===id)||null;
const formatTime=value=>value?new Date(Number(value)).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'time unavailable';
const countLabel=(count,word)=>`${count} ${count===1?word:(word==='entity'?'entities':word+'s')}`;
function subjectFor(repo,entry){const metadata=entry.subject||{};const id=entityIdForEntry(entry);const entity=currentEntityById(repo,id);return {...metadata,id,name:metadata.after_name||metadata.before_name||entity?.name||'',kind:metadata.kind||entity?.kind||'',file:metadata.file||entity?.file||'',before_source:metadata.before_source||'',after_source:metadata.after_source||entity?.source||''}}
function undoTarget(repo,entry,index){const root=entry.after?.root;if(!root)return null;for(let candidate=index-1;candidate>=0;candidate--){const previous=repo.operations[candidate];if(previous.before?.root===root)return {index:candidate,entry:previous,restored:false}}for(let candidate=index-1;candidate>=0;candidate--){const previous=repo.operations[candidate];if(previous.after?.root===root)return {index:candidate,entry:previous,restored:true}}return null}
function operationNarrative(repo,entry,index){const variant=opVariant(entry.op),payload=opPayload(entry),subject=subjectFor(repo,entry),name=subject.name||'entity';switch(variant){case'New':return [`Started change ${short(payload.change)}`,'Created a new semantic revision.'];case'Describe':return [`Described change “${payload.msg||''}”`,'Updated the revision description.'];case'Branch':return [`Created branch ${payload.name||''}`,'Started a parallel line of work.'];case'Rename':{const before=subject.before_name||'previous name',after=payload.new||subject.after_name||name;return [`Renamed ${before} → ${after}`,subject.file||'Updated the entity and rendered references.']}case'Move':return [`Moved ${name}`,subject.file||'Changed the entity parent.'];case'Relocate':return [`Relocated ${name} to ${payload.file||subject.file||'another file'}`,subject.file||'Changed the entity file or order.'];case'Extract':return [`Extracted ${name}`,'Hoisted a nested definition into its own entity.'];case'Inline':return [`Inlined ${name}`,'Replaced a call with the entity body.'];case'AddDef':return [`Added ${subject.kind||'definition'} ${name}`,subject.file||'Added a semantic entity.'];case'Delete':return [`Deleted ${subject.kind||'entity'} ${name}`,subject.file||'Removed a semantic entity.'];case'EditDef':return [`Edited ${subject.kind||'entity'} ${name}`,`${entry.observed||'Unclassified'} · declared ${payload.intent||'unknown'}`];case'Merge':return [`Merged change ${short(payload.other)} into this change`,'Created a two-parent semantic revision.'];case'Resolve':{const side={A:'current change',B:'merged-in change',Base:'merge base'}[payload.take]||'selected side';return [`Resolved conflict ${payload.conflict??''}: kept ${side}`,'Recorded the semantic resolution for replay.']}case'Undo':{const target=undoTarget(repo,entry,index);if(!target)return ['Undid a repository operation',`Restored snapshot ${short(entry.after?.root)}.`];const targetVariant=opVariant(target.entry.op),targetSubject=subjectFor(repo,target.entry);return [target.restored?`Restored state from #${operationIx(target.entry,target.index)}`:`Undid #${operationIx(target.entry,target.index)} ${targetVariant}${targetSubject.name?` on ${targetSubject.name}`:''}`,`Repository now points to snapshot ${short(entry.after?.root)}.`]}case'Absorb':{const t=touchSummary(entry);return [t.title||'Absorbed working-copy edits',t.detail||'Recorded changes made outside a typed operation.']}default:return [variant,subject.file||'Typed repository operation.']}}
const touchKind=touch=>typeof touch==='string'?touch:(Object.keys(touch||{})[0]||'Edited');
function touchSummary(entry){const subjects=entry.subjects||[],files=entry.files||[];if(!subjects.length&&!files.length)return {};const counts={};for(const s of subjects){const k=touchKind(s.touch);counts[k]=(counts[k]||0)+1}const words=[['Renamed','renamed'],['Edited','edited'],['Added','added'],['Removed','removed'],['Moved','moved'],['Relocated','relocated']].filter(([k])=>counts[k]).map(([k,w])=>`${counts[k]} ${w}`);const names=subjects.slice(0,4).map(s=>s.name).filter(Boolean);const title=`Absorbed hand edits: ${[subjects.length?countLabel(subjects.length,'entity'):'',files.length?countLabel(files.length,'file'):''].filter(Boolean).join(', ')}`;const detail=[words.join(', '),names.length?names.join(', ')+(subjects.length>names.length?` and ${subjects.length-names.length} more`:''):'',files.slice(0,3).join(', ')+(files.length>3?` and ${files.length-3} more`:'')].filter(Boolean).join(' — ');return {title,detail}}
const checkoutLabel=entry=>entry.workspace?`from checkout ${entry.workspace}`:'';
function operationChange(repo,entry){return entry.change||snapshotForEntry(repo,entry)?.change||'journal'}
function buildChanges(repo){const groups=new Map();for(const snapshot of repo.snapshots){if(!groups.has(snapshot.change))groups.set(snapshot.change,{id:snapshot.change,snapshots:[],operations:[]});groups.get(snapshot.change).snapshots.push(snapshot)}repo.operations.forEach((entry,index)=>{const id=operationChange(repo,entry);if(!groups.has(id))groups.set(id,{id,snapshots:[],operations:[]});groups.get(id).operations.push({entry,index})});const changes=[...groups.values()];for(const change of changes){change.snapshots.sort((a,b)=>(a.id===repo.head?-1:b.id===repo.head?1:0));change.message=change.snapshots.find(snapshot=>snapshot.message)?.message||change.operations.map(item=>opVariant(item.entry.op)==='Describe'?opPayload(item.entry).msg:'').filter(Boolean).at(-1)||'(undescribed change)';change.head=change.snapshots.some(snapshot=>(repo.heads?.length?repo.heads:[repo.head]).includes(snapshot.id));change.conflicts=change.snapshots.reduce((sum,snapshot)=>sum+(snapshot.conflicts?.length||0),0);change.entities=change.snapshots.find(snapshot=>snapshot.entities?.length)?.entities.length||0;change.latest=Math.max(0,...change.operations.map(item=>Number(item.entry.at)||0));change.counts=change.operations.reduce((counts,item)=>{const key=opVariant(item.entry.op);counts[key]=(counts[key]||0)+1;return counts},{});change.groups=[...new Set(change.operations.map(item=>item.entry.group_name).filter(Boolean))];change.touched=[...new Set(change.operations.flatMap(item=>[entityIdForEntry(item.entry),...((item.entry.subjects||[]).map(s=>s.entity))]).filter(Boolean))];change.checkouts=[...new Set(change.operations.map(item=>item.entry.workspace).filter(Boolean))];if(change.message==='(undescribed change)'){const told=change.operations.filter(item=>!['New','Describe'].includes(opVariant(item.entry.op))).sort((a,b)=>(opVariant(a.entry.op)==='Absorb')-(opVariant(b.entry.op)==='Absorb'));if(told.length){const [title]=operationNarrative(repo,told[0].entry,told[0].index);change.message=told.length>1?`${title} · ${told.length-1} more`:title}}}const snapshotChanges=new Map(repo.snapshots.map(snapshot=>[snapshot.id,snapshot.change]));for(const change of changes)change.parents=[...new Set(change.snapshots.flatMap(snapshot=>snapshot.parents||[]).map(parent=>snapshotChanges.get(parent)).filter(parent=>parent&&parent!==change.id))];return changes.sort((a,b)=>(b.head-a.head)||(b.latest-a.latest))}
function countSummary(change){const parts=[];for(const [variant,label] of [['Rename','rename'],['EditDef','edit'],['AddDef','addition'],['Merge','merge'],['Resolve','resolution'],['Undo','undo'],['Absorb','absorb']])if(change.counts[variant])parts.push(countLabel(change.counts[variant],label));if(change.touched?.length)parts.push(countLabel(change.touched.length,'entity'));return parts.join(' · ')||countLabel(change.operations.length,'operation')}
const groupSummary=change=>[...(change.groups||[]),...((change.checkouts||[]).map(c=>`checkout ${c}`))].join(', ');
const repositoryDescription=repo=>/^\d+ entities, \d+ operations, \d+ changes$/.test(repo.description||'')?'Semantic history recorded by svc.':(repo.description||'Semantic repository history');
function renderChangeList(changes){return changes.map(change=>`<button class="change-button ${change.id===currentChange?.id?'active':''}" data-change="${esc(change.id)}"><span class="graph-dot"></span><span><span class="section-head"><span class="change-title">${esc(change.message)}</span>${change.head?'<span class="pill head">CURRENT</span>':''}</span><span class="muted small">${groupSummary(change)?`${esc(groupSummary(change))} · `:''}${esc(formatTime(change.latest))} · ${esc(countSummary(change))}${change.conflicts?` · ${change.conflicts} conflict${change.conflicts===1?'':'s'}`:''}</span>${change.parents.length?`<span class="muted small" style="display:block">from ${change.parents.map(id=>esc(changes.find(c=>c.id===id)?.message||short(id))).join(' + ')}</span>`:''}</span></button>`).join('')||'<div class="empty">No semantic history exported yet.</div>'}
function sourcePane(label,source,file,highlighted=''){return `<div class="source-pane"><div class="source-label">${esc(label)}${file?` · ${esc(file)}`:''}</div>${source?`<pre class="source" data-language="${esc(String(file||'').split('.').pop())}">${highlighted||esc(source)}</pre>`:'<div class="source empty">Source is not present in this catalog yet.</div>'}</div>`}
function sourceDiff(subject){if(!subject.before_source&&!subject.after_source)return '';if(subject.before_source===subject.after_source)return sourcePane('Source',subject.after_source,subject.file,subject.after_source_html);return `<div class="source-grid">${sourcePane('Before',subject.before_source,subject.file,subject.before_source_html)}${sourcePane('After',subject.after_source,subject.file,subject.after_source_html)}</div>`}
function renderOperation(repo,item){const {entry,index}=item,[title,summary]=operationNarrative(repo,entry,index),subject=subjectFor(repo,entry),variant=opVariant(entry.op),flagged=entry.flagged||entry.observed==='BindingChanging';return `<article class="operation ${flagged?'flagged':''}" id="operation-${operationIx(entry,index)}"><div class="section-head"><div><div class="operation-title">${esc(title)}</div><div class="operation-summary">${esc(summary)}</div></div><div class="badges"><span class="pill">#${operationIx(entry,index)}</span><span class="pill">${esc(variant)}</span>${entry.observed?`<span class="pill ${flagged?'bad':'good'}">${esc(entry.observed)}</span>`:''}</div></div><div class="op-meta muted small">${esc(formatTime(entry.at))}${checkoutLabel(entry)?` · ${esc(checkoutLabel(entry))}`:''}${subject.kind?` · ${esc(subject.kind)}`:''}${subject.file?` · ${esc(subject.file)}`:''}</div>${renderTouched(entry)}${sourceDiff(subject)}<details><summary>Technical record</summary><pre>${json(entry)}</pre></details></article>`}
function renderTouched(entry){const subjects=(entry.subjects||[]).filter(s=>s.entity!==entityIdForEntry(entry)),files=entry.files||[];if(!subjects.length&&!files.length)return '';return `<details><summary>${countLabel(subjects.length,'entity')}${files.length?` and ${countLabel(files.length,'file')}`:''} touched</summary><p class="small">${subjects.slice(0,60).map(s=>`<span class="pill">${esc(touchKind(s.touch).toLowerCase())} ${esc(s.name)}</span>`).join(' ')}${subjects.length>60?` <span class="muted">and ${subjects.length-60} more</span>`:''}</p>${files.length?`<p class="small muted">${files.map(esc).join(' · ')}</p>`:''}</details>`}
function lineDiff(a,b){const n=a.length,m=b.length;if(n*m>4e6)return [...a.map((_,i)=>['-',i,-1]),...b.map((_,j)=>['+',-1,j])];const L=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);const out=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push([' ',i,j]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){out.push(['-',i,-1]);i++}else{out.push(['+',-1,j]);j++}}while(i<n)out.push(['-',i++,-1]);while(j<m)out.push(['+',-1,j++]);return out}
const splitLines=(text,html)=>{const lines=text?text.split('\n'):[];const marked=html?html.split('\n').slice(0,lines.length):[];return lines.map((line,k)=>marked[k]??esc(line))};
function renderLineDiff(t){const a=t.before_source?t.before_source.split('\n'):[],b=t.after_source?t.after_source.split('\n'):[],ah=splitLines(t.before_source,t.before_source_html),bh=splitLines(t.after_source,t.after_source_html),ops=lineDiff(a,b);const keep=new Set();ops.forEach(([k],ix)=>{if(k!==' ')for(let d=-3;d<=3;d++)keep.add(ix+d)});let html='',skipped=0;const flush=()=>{if(skipped){html+=`<span class="dl skip">… ${countLabel(skipped,'unchanged line')} …</span>`;skipped=0}};ops.forEach(([k,i,j],ix)=>{if(!keep.has(ix)){skipped++;return}flush();html+=k==='-'?`<span class="dl del">${ah[i]}</span>`:k==='+'?`<span class="dl add">${bh[j]}</span>`:`<span class="dl ctx">${bh[j]}</span>`});flush();const added=ops.filter(([k])=>k==='+').length,removed=ops.filter(([k])=>k==='-').length;return {html:`<pre class="source diff" data-language="${esc(String(t.file||'').split('.').pop())}">${html}</pre>`,added,removed}}
const touchWord=k=>({Added:'added',Removed:'removed',Renamed:'renamed',Moved:'moved',Relocated:'relocated',Edited:'edited'})[k]||k.toLowerCase();
function renderEntityChange(t,open){const kinds=[...new Set(t.touches.map(x=>touchKind(x.touch)))];const renamed=t.touches.map(x=>x.touch?.Renamed).find(Boolean);const label=renamed?`${renamed.from} → ${renamed.to}`:t.name;const textChanged=t.before_source!==t.after_source&&(t.before_source||t.after_source);const diff=textChanged?renderLineDiff(t):null;const counts=diff?[diff.added?`+${diff.added}`:'',diff.removed?`−${diff.removed}`:''].filter(Boolean).join(' '):'';return `<details class="entity-change" ${open?'open':''}><summary class="entity-head"><b>${esc(label)}</b><span class="pill">${esc(t.kind||'')}</span><span class="muted small">${kinds.map(touchWord).join(', ')}${counts?` · ${esc(counts)}`:''} · ${esc(t.file||'')}</span><span class="small"><a href="#" data-entity="${esc(t.entity)}" class="muted">history ›</a></span></summary>${diff?diff.html:`<p class="muted small">${kinds.includes('Removed')?'The definition is gone.':'Text unchanged.'}</p>`}</details>`}
async function loadChangeEntities(repo,change){const box=document.querySelector('#change-entities');if(!box||!change)return;const ops=change.operations.filter(item=>(item.entry.subjects||[]).length||subjectFor(repo,item.entry).id);if(!ops.length){box.innerHTML='';return}box.innerHTML='<p class="muted small">Reading what changed, entity by entity…</p>';const lists=await Promise.all(ops.map(async item=>{const response=await fetch(`/api/repositories/${encodeURIComponent(repo.slug)}/operations/${operationIx(item.entry,item.index)}/subjects`);return response.ok?await response.json():[]}));if(currentChange?.id!==change.id)return;const merged=new Map();lists.forEach((touches,k)=>{for(const t of touches){let m=merged.get(t.entity);if(!m){m={entity:t.entity,name:t.name,kind:t.kind,file:t.file,touches:[],before_source:t.before_source||'',before_source_html:t.before_source_html||'',after_source:'',after_source_html:'',first:k};merged.set(t.entity,m)}m.touches.push(t);m.name=t.name||m.name;m.kind=t.kind||m.kind;m.file=t.file||m.file;if(t.after_source||t.before_source){m.after_source=t.after_source||'';m.after_source_html=t.after_source_html||''}}});const all=[...merged.values()].sort((x,y)=>(x.file||'').localeCompare(y.file||'')||(x.name||'').localeCompare(y.name||''));const changed=all.filter(t=>t.before_source!==t.after_source),same=all.filter(t=>t.before_source===t.after_source);const LIMIT=30;const render=limit=>{box.innerHTML=`<h3>What changed, entity by entity</h3><p class="muted small">${countLabel(changed.length,'entity')} with new text${same.length?`, ${countLabel(same.length,'entity')} only moved or renamed in place`:''}</p>${changed.slice(0,limit).map((t,ix)=>renderEntityChange(t,ix<3)).join('')}${changed.length>limit?`<button class="change-button" id="more-entities">Show ${changed.length-limit} more</button>`:''}${same.length?`<details><summary>${countLabel(same.length,'entity')} without a text change</summary><p class="small">${same.map(t=>`<span class="pill">${esc([...new Set(t.touches.map(x=>touchKind(x.touch)))].map(touchWord).join('/'))} ${esc(t.name)}</span>`).join(' ')}</p></details>`:''}`;document.querySelector('#more-entities')?.addEventListener('click',()=>render(changed.length));bindEntityCards()};render(LIMIT)}
function renderTouchedEntities(repo,change){const entities=change.touched.map(id=>currentEntityById(repo,id)).filter(Boolean);if(!entities.length)return '';return `<h3>Affected entities</h3><div class="entity-grid">${entities.map(entity=>entityCard(entity)).join('')}</div>`}
function renderChangeDetail(repo,change){if(!change)return '<div class="empty">Select a change.</div>';const snapshots=change.snapshots;return `<div class="change-hero"><div class="section-head"><div><h2>${esc(change.message)}</h2><div class="muted">${groupSummary(change)?`${esc(groupSummary(change))} · `:''}${esc(formatTime(change.latest))} · ${esc(countSummary(change))}</div></div>${change.head?'<span class="pill head">CURRENT HEAD</span>':''}</div><div class="stats"><span class="pill">${change.entities||'—'} entities</span><span class="pill">${snapshots.length} snapshot${snapshots.length===1?'':'s'}</span>${change.conflicts?`<span class="pill bad">${change.conflicts} conflicts</span>`:'<span class="pill good">No conflicts</span>'}</div></div><section id="change-entities"></section><h3>Typed operations</h3>${change.operations.length?change.operations.slice().reverse().map(item=>renderOperation(repo,item)).join(''):'<div class="empty">No typed operations are attached to this change.</div>'}<details><summary>Revision identities</summary><pre>${esc(snapshots.map(snapshot=>`${snapshot.id}  change ${snapshot.change}  parents ${snapshot.parents.join(', ')||'none'}`).join('\n'))}</pre></details>`}
function entityCard(entity){const synthetic=String(entity.name).startsWith('«');return `<article class="entity ${synthetic?'synthetic':''}" data-entity="${esc(entity.id)}" tabindex="0"><div class="section-head"><b>${esc(entity.name||'(anonymous)')}</b><span class="pill">${esc(entity.kind)}</span></div><p class="muted small">${esc(entity.file)} · ordinal ${entity.ordinal}</p></article>`}
function entityKinds(){return [...new Set((currentRepo?.snapshots.flatMap(snapshot=>snapshot.entities||[])||[]).map(entity=>entity.kind))].sort()}
function allCurrentEntities(){const snapshot=currentRepo?.snapshots.find(candidate=>candidate.id===currentRepo.head)||currentRepo?.snapshots.find(candidate=>candidate.entities?.length);return snapshot?.entities||[]}
function filteredEntities(){const query=document.querySelector('#entity-query')?.value.trim().toLowerCase()||'',kind=document.querySelector('#entity-kind')?.value||'',includeSynthetic=document.querySelector('#include-synthetic')?.checked||false;return allCurrentEntities().filter(entity=>(includeSynthetic||!String(entity.name).startsWith('«'))&&(!kind||entity.kind===kind)&&(!query||[entity.name,entity.file,entity.kind,entity.id].some(value=>String(value??'').toLowerCase().includes(query))))}
function entityOperations(entity){return currentRepo.operations.map((entry,index)=>({entry,index})).filter(item=>entityIdForEntry(item.entry)===entity.id||(item.entry.subjects||[]).some(s=>s.entity===entity.id))}
function entityDetail(entity){if(!entity)return '<div class="empty">Select an entity to inspect source and history.</div>';const parent=allCurrentEntities().find(candidate=>candidate.id===entity.parent),history=entityOperations(entity);return `<div class="section-head"><div><h2>${esc(entity.name)}</h2><div class="muted">${esc(entity.kind)} · ${esc(entity.file)} · ordinal ${entity.ordinal}</div></div></div>${sourcePane('Current source',entity.source||'',entity.file,entity.source_html||'')}<h3>Entity history</h3>${history.length?history.slice().reverse().map(item=>renderOperation(currentRepo,item)).join(''):'<div class="empty">No exported operation directly names this entity.</div>'}<details><summary>Identity and content hashes</summary><dl><dt>Identity</dt><dd><code>${esc(entity.id)}</code></dd><dt>Parent reference</dt><dd>${entity.parent?`${esc(parent?.name||'entity')} <code>${esc(entity.parent)}</code>`:'Top-level entity'}</dd><dt>Content identity</dt><dd><code>${esc(entity.content)}</code></dd><dt>Source bytes</dt><dd><code>${esc(entity.bytes)}</code></dd></dl><pre>${json(entity)}</pre></details>`}
async function selectEntity(id){currentEntity=allCurrentEntities().find(entity=>entity.id===id)||null;document.querySelectorAll('[data-entity]').forEach(card=>card.classList.toggle('selected',card.dataset.entity===id));const detail=document.querySelector('#entity-detail');if(detail)detail.innerHTML=entityDetail(currentEntity);if(!currentEntity?.source||currentEntity.source_html)return;const selected=id;const response=await fetch(`/api/repositories/${encodeURIComponent(currentRepo.slug)}/entities/${encodeURIComponent(id)}/source`);if(!response.ok||currentEntity?.id!==selected)return;const highlighted=await response.json();currentEntity.source_html=highlighted.source_html||'';if(detail)detail.innerHTML=entityDetail(currentEntity)}
function renderEntities(){const target=document.querySelector('#entity-results');if(!target)return;const matches=filteredEntities(),shown=matches.slice(0,entityLimit);if(currentEntity&&!matches.some(entity=>entity.id===currentEntity.id))currentEntity=null;target.innerHTML=`<p class="muted">Showing ${shown.length} of ${matches.length} semantic entities</p><div class="entity-grid">${shown.map(entityCard).join('')}</div>${shown.length<matches.length?'<button id="more-entities">Show 100 more</button>':''}`;document.querySelectorAll('[data-entity]').forEach(card=>{card.addEventListener('click',()=>selectEntity(card.dataset.entity));card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectEntity(card.dataset.entity)}})});document.querySelector('#more-entities')?.addEventListener('click',()=>{entityLimit+=PAGE_SIZE;renderEntities()});const detail=document.querySelector('#entity-detail');if(detail)detail.innerHTML=entityDetail(currentEntity)}
function conflictSummary(conflict){const kind=opVariant(conflict),value=typeof conflict==='string'?{}:conflict[kind]||{};switch(kind){case'Attr':return ['Attribute disagreement','Both sides changed the same entity attribute differently.'];case'Content':return ['Overlapping semantic edit',`${value.hunks?.length||0} semantic hunks require resolution.`];case'AddAdd':return [`Both sides added ${value.key?.name||'a definition'}`,`${value.key?.kind||'Definition'} was created independently.`];case'DeleteEdit':return ['Delete/edit conflict','One side deleted the entity while the other edited it.'];case'Binding':return [`Binding changed for ${value.name||'an identifier'}`,`Resolution at ${value.at?.line||'?'}:${value.at?.col??'?'} changed across the merge.`];default:return [kind,'This conflict requires semantic review.']}}
function renderConflict(conflict){const [title,note]=conflictSummary(conflict);return `<article class="operation conflict"><div class="section-head"><div><div class="operation-title">${esc(title)}</div><div class="operation-summary">${esc(note)}</div></div><span class="pill bad">Needs resolution</span></div><details><summary>Technical record</summary><pre>${json(conflict)}</pre></details></article>`}
function renderReviews(items){if(!items.length)return '<div class="review-clear">Review queue clear. No edit verdicts, notes, or binding conflicts need attention.</div>';return items.map(item=>{const variant=opVariant(item),payload=typeof item==='string'?{}:item[variant]||{};if(variant==='BindingConflict')return renderConflict(payload.conflict);if(variant==='Note'){const kind=payload.kind||'Note',dest=typeof payload.to==='string'?payload.to:(Object.keys(payload.to||{})[0]||''),flagged=kind==='RequestChanges';return `<article class="operation ${flagged?'flagged':''}"><div class="section-head"><div><div class="operation-title">${esc(kind)} → ${esc(dest)}</div><div class="operation-summary">${esc(payload.text||'')}</div></div><span class="pill ${kind==='Approve'?'good':flagged?'bad':'warn'}">${esc(kind)}</span></div><details><summary>Technical record</summary><pre>${json(item)}</pre></details></article>`}const operation=currentRepo.operations.map((entry,index)=>({entry,index})).find(candidate=>operationIx(candidate.entry,candidate.index)===Number(payload.op));const verdict=payload.observed||operation?.entry.observed||'Not classified',flagged=verdict==='BindingChanging';return `<article class="operation ${flagged?'flagged':''}"><div class="section-head"><div><div class="operation-title">Review edit operation #${esc(payload.op??'?')}</div><div class="operation-summary">Declared ${esc(payload.declared||'unknown')}; observed ${esc(verdict)}.</div></div><span class="pill ${flagged?'bad':'good'}">${flagged?'Needs attention':'Verified'}</span></div>${operation?sourceDiff(subjectFor(currentRepo,operation.entry)):''}<details><summary>Technical record</summary><pre>${json(item)}</pre></details></article>`}).join('')}
function selectTab(name){activeTab=name;document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===name));document.querySelectorAll('.tab-panel').forEach(panel=>panel.classList.toggle('active',panel.id===`tab-${name}`));if(name==='entities')renderEntities()}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>selectTab(button.dataset.tab)))}
function selectChange(id){currentChange=buildChanges(currentRepo).find(change=>change.id===id)||null;const list=document.querySelector('#change-list'),detail=document.querySelector('#change-detail');if(list)list.innerHTML=renderChangeList(buildChanges(currentRepo));if(detail)detail.innerHTML=renderChangeDetail(currentRepo,currentChange);bindChangeButtons();bindEntityCards();loadChangeEntities(currentRepo,currentChange)}
function bindChangeButtons(){document.querySelectorAll('[data-change]').forEach(button=>button.addEventListener('click',()=>selectChange(button.dataset.change)))}
function bindEntityCards(){document.querySelectorAll('[data-entity]').forEach(card=>card.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();selectTab('entities');selectEntity(card.dataset.entity)}))}
async function show(slug){const response=await fetch('/api/repositories/'+encodeURIComponent(slug));if(!response.ok)throw Error(response.statusText);currentRepo=await response.json();const changes=buildChanges(currentRepo);currentChange=changes.find(change=>change.head)||changes[0]||null;currentEntity=null;entityLimit=PAGE_SIZE;view.innerHTML=`<div class="repo-header"><div><h2>${esc(currentRepo.name)}</h2><p class="muted">${esc(repositoryDescription(currentRepo))}</p><p class="small muted">${esc(currentRepo.path)}</p></div><span class="pill head">CURRENT ${esc(short(currentRepo.head))}</span></div><div class="stats"><span class="pill">${countLabel(changes.length,'change')}</span><span class="pill">${countLabel(currentRepo.operations.length,'typed operation')}</span><span class="pill">${countLabel(allCurrentEntities().length,'entity')}</span><span class="pill ${currentRepo.review_queue.length?'warn':'good'}">${countLabel(currentRepo.review_queue.length,'review')}</span></div><div class="tabs"><button class="tab active" data-tab="history">History</button><button class="tab" data-tab="entities">Entities</button><button class="tab" data-tab="review">Review ${currentRepo.review_queue.length?`(${currentRepo.review_queue.length})`:''}</button></div><div id="tab-history" class="tab-panel active"><div class="history-layout"><div id="change-list" class="change-list">${renderChangeList(changes)}</div><div id="change-detail" class="change-detail">${renderChangeDetail(currentRepo,currentChange)}</div></div></div><div id="tab-entities" class="tab-panel"><div class="filters"><input id="entity-query" type="search" placeholder="Search entity name, file, or kind"><select id="entity-kind"><option value="">All kinds</option>${entityKinds().map(kind=>`<option>${esc(kind)}</option>`).join('')}</select><label class="pill"><input id="include-synthetic" type="checkbox"> include generated</label></div><div class="entity-layout"><div id="entity-results"></div><aside id="entity-detail" class="entity-detail"></aside></div></div><div id="tab-review" class="tab-panel"><h3>Review queue</h3>${renderReviews(currentRepo.review_queue)}</div>`;bindTabs();bindChangeButtons();bindEntityCards();loadChangeEntities(currentRepo,currentChange);for(const id of ['entity-query','entity-kind','include-synthetic'])document.querySelector(`#${id}`)?.addEventListener('input',()=>{entityLimit=PAGE_SIZE;renderEntities()});selectTab(activeTab)}
async function load(){const response=await fetch('/api/repositories');if(!response.ok)throw Error(response.statusText);const repositories=await response.json();repos.innerHTML=repositories.map(repo=>`<button class="repo-button" data-slug="${esc(repo.slug)}"><b>${esc(repo.name)}</b><br><span class="muted small">${countLabel(repo.operations,'operation')} · ${countLabel(repo.reviews,'review')}</span></button>`).join('')||'<p class="muted">No repositories exported.</p>';repos.querySelectorAll('[data-slug]').forEach(button=>button.addEventListener('click',()=>{repos.querySelectorAll('button').forEach(item=>item.classList.remove('active'));button.classList.add('active');show(button.dataset.slug).catch(showError)}));if(repositories[0]){repos.querySelector('button')?.classList.add('active');await show(repositories[0].slug)}}
function showError(error){view.innerHTML=`<p class="error">${esc(error)}</p>`}
load().catch(showError);
</script>
