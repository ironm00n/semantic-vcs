<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>svc forge</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#131a2d;--panel2:#0f1628;--ink:#edf2ff;--muted:#98a4bf;--line:#28334f;--accent:#70e1b2;--warn:#ffbd69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px ui-monospace,SFMono-Regular,Menlo,monospace}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:18px;align-items:baseline}h1{font-size:20px;margin:0;color:var(--accent)}h2{font-size:27px;margin:0 0 6px;letter-spacing:-1px}h3{margin-top:26px}main{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 61px)}nav{border-right:1px solid var(--line);padding:16px;background:var(--panel2)}button,input,select{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel);color:var(--ink);font:inherit}button{cursor:pointer}button:hover,button.active{border-color:var(--accent)}nav button{width:100%;text-align:left;margin:0 0 8px}section{padding:26px;overflow:auto;min-width:0}.repo-header{padding:3px 0 8px}.muted{color:var(--muted)}.stats,.filters,.change-row,.tabs,.fields{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs{position:sticky;top:-26px;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);margin:20px 0 18px;padding-top:8px}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent}.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-panel{display:none}.tab-panel.active{display:block}.pill{padding:5px 8px;background:var(--panel);border-radius:20px;border:1px solid var(--line)}.head{color:var(--bg);background:var(--accent);border-color:var(--accent)}article{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0}.snapshot.selected,.entity.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.conflict{border-left:3px solid var(--warn)}.filters input{min-width:240px;flex:1}.entity-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(250px,.75fr);gap:14px;align-items:start}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}.entity{margin:0;min-width:0;cursor:pointer}.entity code{color:var(--accent)}.entity-detail{position:sticky;top:62px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:18px;overflow-wrap:anywhere}.entity-detail dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px}.entity-detail dt{color:var(--muted)}.entity-detail dd{margin:0}details{margin-top:10px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#c8d2eb}.change-row button{width:auto}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.empty{padding:32px;text-align:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted)}.field{padding:6px 8px;border-radius:6px;background:#0d1426;overflow-wrap:anywhere}.op-title{font-size:16px;color:var(--accent)}.semantic-note{line-height:1.55;color:#cbd5ec}.conflict-kind{color:var(--warn)}@media(max-width:760px){header{padding:14px 16px}header .muted{display:none}main{display:block;min-height:0}nav{display:flex;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}nav button{min-width:180px;margin:0}section{padding:18px 16px}.repo-header h2{font-size:24px}.tabs{top:-18px;margin-left:-16px;margin-right:-16px;padding-left:12px;overflow-x:auto;flex-wrap:nowrap}.tabs button{white-space:nowrap}.filters input{min-width:100%}.entity-layout{grid-template-columns:1fr}.entity-detail{position:static;order:-1}.entity-grid{grid-template-columns:1fr}.change-row button{width:100%;text-align:left}.section-head{align-items:flex-start}.fields{align-items:stretch}.field{width:100%}}
article,p,code,.field,.entity-detail dd{min-width:0;overflow-wrap:anywhere;word-break:break-word}
</style></head><body><header><h1>svc forge</h1><span class="muted">compiler-grade history, locally</span></header><main><nav id="repos">Loading repositories…</nav><section id="view"><p class="muted">Choose a repository.</p></section></main><script>
const repos=document.querySelector('#repos'),view=document.querySelector('#view');
const PAGE_SIZE=100;
let currentRepo=null,currentSnapshot=null,currentEntity=null,entityLimit=PAGE_SIZE;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const json=x=>esc(JSON.stringify(x,null,2));
const opVariant=op=>typeof op==='string'?op:(Object.keys(op)[0]||'Unknown');
const short=id=>String(id??'').slice(0,12);
function snapshotById(id){return currentRepo.snapshots.find(snapshot=>snapshot.id===id)}
function snapshotLabel(snapshot){return `${snapshot.message||'(undescribed)'} · ${short(snapshot.id)}`}
function changeGroups(repo){const groups=new Map();repo.snapshots.forEach(snapshot=>{if(!groups.has(snapshot.change))groups.set(snapshot.change,[]);groups.get(snapshot.change).push(snapshot)});return groups}
function renderChangeNav(repo){return [...changeGroups(repo)].map(([change,snapshots])=>`<article><div class="section-head"><b>Change ${esc(short(change))}</b><span class="muted">${snapshots.length} snapshot${snapshots.length===1?'':'s'}</span></div><div class="change-row">${snapshots.map(snapshot=>`<button data-snapshot="${esc(snapshot.id)}" class="${snapshot.id===repo.head?'head':''}">${snapshot.id===repo.head?'HEAD · ':''}${esc(snapshotLabel(snapshot))}</button>`).join('')}</div></article>`).join('')||'<p class="muted">No changes.</p>'}
function conflictSummary(conflict){const kind=opVariant(conflict),value=typeof conflict==='string'?{}:conflict[kind]||{};switch(kind){case'Attr':return [`Attribute disagreement on entity ${short(value.id)}`,`The two sides changed the same entity attribute differently.`];case'Content':return [`Content conflict on entity ${short(value.id)}`,`${value.hunks?.length||0} overlapping semantic hunk${value.hunks?.length===1?'':'s'} require resolution.`];case'AddAdd':return [`Concurrent definition: ${value.key?.name||'unnamed'}`,`${value.key?.kind||'Definition'} was added independently as ${short(value.a)} and ${short(value.b)}.`];case'DeleteEdit':return [`Delete/edit conflict on ${short(value.id)}`,`${value.deleted_by||'One side'} deleted the entity while ${value.edited_by||'the other side'} edited it.`];case'Binding':return [`Binding changed for ${value.name||'identifier'}`,`At ${value.at?.line||'?'}:${value.at?.col??'?'}, resolution changed from ${value.was||'unknown'} to ${value.now||'unknown'}.`];default:return [kind,'This conflict requires semantic review.']}}
function renderConflict(conflict){const [title,note]=conflictSummary(conflict);return `<article class="conflict"><div class="section-head"><b class="conflict-kind">${esc(title)}</b><span class="pill">Conflict</span></div><p class="semantic-note">${esc(note)}</p><details><summary>Raw conflict record</summary><pre>${json(conflict)}</pre></details></article>`}
function renderSnapshots(repo){return repo.snapshots.map(snapshot=>`<article id="snapshot-${esc(snapshot.id)}" class="snapshot ${snapshot.id===currentSnapshot?.id?'selected':''} ${snapshot.conflicts.length?'conflict':''}"><div class="section-head"><b>${esc(snapshot.message||'(undescribed)')}</b>${snapshot.id===repo.head?'<span class="pill head">HEAD</span>':''}</div><p><code>${esc(snapshot.id)}</code></p><p>change <code>${esc(snapshot.change)}</code> · ${snapshot.entities.length} entities · ${snapshot.conflicts.length} conflicts · parents ${esc(snapshot.parents.join(', ')||'none')}</p>${snapshot.conflicts.length?`<details><summary>${snapshot.conflicts.length} semantic conflict${snapshot.conflicts.length===1?'':'s'}</summary>${snapshot.conflicts.map(renderConflict).join('')}</details>`:''}</article>`).join('')}
function recordFields(record){if(!record||typeof record!=='object')return '';return Object.entries(record).map(([key,value])=>`<span class="field"><span class="muted">${esc(key)}</span> ${esc(typeof value==='object'?JSON.stringify(value):value)}</span>`).join('')}
function renderOperations(operations){return operations.map((entry,index)=>{const variant=opVariant(entry.op),payload=typeof entry.op==='string'?null:entry.op[variant];return `<article><div class="section-head"><b class="op-title">${esc(variant)}</b><span class="muted">operation #${index}</span></div><div class="fields">${recordFields(payload)}</div>${entry.observed?`<p>Observed: <span class="pill">${esc(entry.observed)}</span></p>`:''}<details><summary>Raw record</summary><pre>${json(entry)}</pre></details></article>`}).join('')||'<div class="empty">No operations recorded yet.</div>'}
function renderReviews(items){return items.map(item=>{const variant=opVariant(item),payload=typeof item==='string'?{}:item[variant]||{};if(variant==='BindingConflict')return `<article><div class="section-head"><b class="op-title">Binding safety review</b><span class="pill">Needs review</span></div><p class="semantic-note">A merge changed which declaration an identifier resolves to.</p>${renderConflict(payload.conflict)}<details><summary>Raw review record</summary><pre>${json(item)}</pre></details></article>`;const observed=payload.observed||'Not classified';return `<article><div class="section-head"><b class="op-title">Edit operation #${esc(payload.op??'?')}</b><span class="pill">${esc(payload.declared||'Review')}</span></div><p class="semantic-note">Declared intent: ${esc(payload.declared||'unknown')}. Observed effect: ${esc(observed)}.</p>${payload.ask_id?`<p>Permission request <code>${esc(payload.ask_id)}</code></p>`:''}<details><summary>Raw review record</summary><pre>${json(item)}</pre></details></article>`}).join('')||'<div class="empty">Review queue clear. No edits or binding changes need attention.</div>'}
function entityKinds(snapshot){return [...new Set((snapshot?.entities||[]).map(entity=>entity.kind))].sort()}
function filteredEntities(){if(!currentSnapshot)return [];const query=document.querySelector('#entity-query')?.value.trim().toLowerCase()||'';const kind=document.querySelector('#entity-kind')?.value||'';return currentSnapshot.entities.filter(entity=>(!kind||entity.kind===kind)&&(!query||[entity.name,entity.file,entity.kind,entity.id].some(value=>String(value??'').toLowerCase().includes(query))))}
function entityDetail(entity){if(!entity)return '<div class="empty">Select an entity to inspect its semantic identity.</div>';const parent=currentSnapshot?.entities.find(candidate=>candidate.id===entity.parent);return `<div class="section-head"><b class="op-title">${esc(entity.name)}</b><span class="pill">${esc(entity.kind)}</span></div><dl><dt>Identity</dt><dd><code>${esc(entity.id)}</code></dd><dt>File</dt><dd>${esc(entity.file)} · ordinal ${entity.ordinal}</dd><dt>Parent reference</dt><dd>${entity.parent?`${esc(parent?.name||'entity')} <code>${esc(entity.parent)}</code>`:'Top-level entity'}</dd><dt>Content identity</dt><dd><code>${esc(entity.content)}</code></dd><dt>Source bytes</dt><dd><code>${esc(entity.bytes)}</code></dd></dl><details><summary>Raw entity record</summary><pre>${json(entity)}</pre></details>`}
function selectEntity(id){currentEntity=currentSnapshot?.entities.find(entity=>entity.id===id)||null;document.querySelectorAll('.entity').forEach(card=>card.classList.toggle('selected',card.dataset.entity===currentEntity?.id));const detail=document.querySelector('#entity-detail');if(detail)detail.innerHTML=entityDetail(currentEntity)}
function renderEntities(){const target=document.querySelector('#entity-results');if(!target||!currentSnapshot)return;const matches=filteredEntities(),shown=matches.slice(0,entityLimit);if(currentEntity&&!matches.some(entity=>entity.id===currentEntity.id))currentEntity=null;target.innerHTML=`<p class="muted">Showing ${shown.length} of ${matches.length} matching entities in ${esc(short(currentSnapshot.id))}</p><div class="entity-grid">${shown.map(entity=>`<article class="entity ${entity.id===currentEntity?.id?'selected':''}" data-entity="${esc(entity.id)}" tabindex="0"><b>${esc(entity.kind)} <code>${esc(entity.name)}</code></b><p>${esc(entity.file)} · ordinal ${entity.ordinal}</p><small class="muted">${esc(entity.id)}</small></article>`).join('')}</div>${shown.length<matches.length?'<button id="more-entities">Show 100 more</button>':''}`;document.querySelectorAll('[data-entity]').forEach(card=>{card.addEventListener('click',()=>selectEntity(card.dataset.entity));card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectEntity(card.dataset.entity)}})});document.querySelector('#more-entities')?.addEventListener('click',()=>{entityLimit+=PAGE_SIZE;renderEntities()});const detail=document.querySelector('#entity-detail');if(detail)detail.innerHTML=entityDetail(currentEntity)}
function selectSnapshot(id,scroll=true){currentSnapshot=snapshotById(id)||currentRepo.snapshots[0]||null;currentEntity=null;entityLimit=PAGE_SIZE;document.querySelectorAll('.snapshot').forEach(card=>card.classList.toggle('selected',card.id===`snapshot-${currentSnapshot?.id}`));const kind=document.querySelector('#entity-kind');if(kind)kind.innerHTML='<option value="">All kinds</option>'+entityKinds(currentSnapshot).map(value=>`<option>${esc(value)}</option>`).join('');renderEntities();if(scroll&&currentSnapshot)document.getElementById(`snapshot-${currentSnapshot.id}`)?.scrollIntoView({behavior:'smooth',block:'center'})}
function bindRepositoryControls(){document.querySelectorAll('[data-snapshot]').forEach(button=>button.addEventListener('click',()=>selectSnapshot(button.dataset.snapshot)));for(const id of ['entity-query','entity-kind'])document.querySelector(`#${id}`).addEventListener('input',()=>{entityLimit=PAGE_SIZE;renderEntities()})}
function selectTab(name){document.querySelectorAll('[data-tab]').forEach(button=>button.classList.toggle('active',button.dataset.tab===name));document.querySelectorAll('.tab-panel').forEach(panel=>panel.classList.toggle('active',panel.id===`tab-${name}`))}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>selectTab(button.dataset.tab)))}
async function load(){const repositories=await fetch('/api/repositories').then(response=>response.json());repos.innerHTML=repositories.map(repo=>`<button data-slug="${esc(repo.slug)}"><b>${esc(repo.name)}</b><br><small class="muted">${repo.snapshots} snapshots · ${repo.operations} ops</small></button>`).join('')||'<span class="muted">No repositories in catalog.</span>';repos.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>show(button.dataset.slug)));if(repositories[0])show(repositories[0].slug)}
async function show(slug){const repo=await fetch('/api/repositories/'+encodeURIComponent(slug)).then(response=>{if(!response.ok)throw Error(response.statusText);return response.json()});currentRepo=repo;currentSnapshot=snapshotById(repo.head)||repo.snapshots[0]||null;view.innerHTML=`<div class="repo-header"><h2>${esc(repo.name)}</h2><p class="muted">${esc(repo.path)} · head ${esc(short(repo.head))}</p><p>${esc(repo.description)}</p></div><div class="stats"><span class="pill">${repo.snapshots.length} snapshots</span><span class="pill">${changeGroups(repo).size} changes</span><span class="pill">${repo.operations.length} typed ops</span><span class="pill">${repo.review_queue.length} reviews</span></div><div class="tabs" role="tablist"><button data-tab="changes" class="active">Changes</button><button data-tab="entities">Entities</button><button data-tab="review">Review</button></div><div id="tab-changes" class="tab-panel active"><h3>Changes & head</h3>${renderChangeNav(repo)}<h3>Snapshots</h3>${renderSnapshots(repo)}<h3>Typed operation history</h3>${renderOperations(repo.operations)}</div><div id="tab-entities" class="tab-panel"><div class="section-head"><h3>Entity browser</h3><span class="muted">Selected snapshot ${esc(short(currentSnapshot?.id))}</span></div><div class="filters"><input id="entity-query" type="search" placeholder="Search name, file, kind, or entity id" aria-label="Search entities"><select id="entity-kind" aria-label="Filter entities by kind"></select></div><div class="entity-layout"><div id="entity-results"></div><aside id="entity-detail" class="entity-detail"></aside></div></div><div id="tab-review" class="tab-panel"><h3>Review queue</h3>${renderReviews(repo.review_queue)}</div>`;bindRepositoryControls();bindTabs();selectSnapshot(currentSnapshot?.id,false)}
load().catch(error=>view.innerHTML='<p class="conflict">'+esc(error)+'</p>');
</script></body></html>
